name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and no secrets are used anywhere in this workflow, so a fork PR
# runs with nothing privileged available to it.
permissions:
  contents: read

# A superseded run is wasted compute; cancel it. `main` pushes are not
# cancelled, so the default branch always has a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Vite reads this; it also keeps Playwright out of watch/interactive modes.
  CI: "true"

jobs:
  # Static checks and the unit/component suite with its coverage gate. Kept
  # separate from e2e so a type error reports in seconds rather than waiting
  # on a browser run.
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests, with coverage thresholds
        run: npm run test:coverage

      # The catalogue is generated from committed inputs, so rebuilding it here
      # must be a no-op. A diff means src/data/catalog.generated.ts or
      # docs/CREDITS.md was hand-edited, which would let a reference past the
      # licence, provenance and alt-text gates. No keys needed: it reads only
      # catalog/approved/.
      - name: Catalogue is in sync with its approved inputs
        run: |
          npm run catalog:build
          git diff --exit-code -- src/data/catalog.generated.ts docs/CREDITS.md

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The journeys, on phone, propped-phone and desktop viewports. Runs against
  # the production build that `npm run test:e2e` produces, not the dev server.
  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Only the browser the suite actually uses, with its system deps.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run test:e2e

      # The report carries traces and failure screenshots, which is the whole
      # point of keeping it when a run goes red.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Accounts against a real backend: the migrations, Supabase Auth and the REST
  # API of a local Supabase stack, which the CLI starts in Docker on this
  # runner. Its keys are the CLI's fixed public demo values, so this job holds
  # no secrets either, and nothing in it can reach the hosted project.
  accounts:
    name: Accounts against a local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Pinned here and in docs/deploying-accounts.md, so the CLI that proves
      # the migrations is the one the owner applies them with.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      # supabase/config.toml switches off everything little wash does not use:
      # this is Postgres, Auth, the REST API and its gateway.
      - name: Start the local stack
        run: supabase start

      - name: The migrations apply to a clean database
        run: supabase db reset

      - name: The database functions pass the linter
        run: supabase db lint --local --level warning --fail-on error

      - name: Point the checks at the stack
        run: supabase status -o json | npx tsx scripts/ci/supabase-env.ts >> "$GITHUB_ENV"

      - name: Backend checks
        run: npm run test:integration

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The e2e build, its account address pointed at the stack instead of the
      # fake host in .env.e2e. Only the publishable key reaches the build.
      - name: Account journeys against the stack
        run: npm run test:e2e:live
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload the live journeys' report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-live
          path: playwright-report-live/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the live journeys' failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-live
          path: test-results-live/
          retention-days: 14
          if-no-files-found: ignore

      - name: The stack's logs, on failure
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_auth_little-wash --tail 200 || true
          docker logs supabase_rest_little-wash --tail 200 || true
