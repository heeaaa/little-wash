name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and no secrets are used anywhere in this workflow, so a fork PR
# runs with nothing privileged available to it.
permissions:
  contents: read

# A superseded run is wasted compute; cancel it. `main` pushes are not
# cancelled, so the default branch always has a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Vite reads this; it also keeps Playwright out of watch/interactive modes.
  CI: "true"

jobs:
  # Static checks and the unit/component suite with its coverage gate. Kept
  # separate from e2e so a type error reports in seconds rather than waiting
  # on a browser run.
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests, with coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The journeys, on phone, propped-phone and desktop viewports. Runs against
  # the production build that `npm run test:e2e` produces, not the dev server.
  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Only the browser the suite actually uses, with its system deps.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run test:e2e

      # The report carries traces and failure screenshots, which is the whole
      # point of keeping it when a run goes red.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
